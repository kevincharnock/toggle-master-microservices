# ============================================================================
# Self-healing (Runbook Automation): webhook que reinicia o auth-service quando o
# alerta de 5xx do Grafana dispara. Manifestos em observability/self-healing/
# (kustomize gera o ConfigMap a partir do script heal.py).
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-healing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kevincharnock/toggle-master-microservices.git
    targetRevision: main
    path: observability/self-healing
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

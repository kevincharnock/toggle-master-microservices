# ============================================================================
# Dashboards customizados do Grafana (ConfigMaps em observability/dashboards/).
# O sidecar do Grafana carrega todo ConfigMap com a label grafana_dashboard: "1".
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kevincharnock/toggle-master-microservices.git
    targetRevision: main
    path: observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

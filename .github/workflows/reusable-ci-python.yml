# ============================================================================
# WORKFLOW REUTILIZAVEL - SERVICOS EM PYTHON
# (analytics-service, flag-service, targeting-service)
#
# Mesma estrutura do reusable-ci-go.yml, mas com as ferramentas do ecossistema
# Python nos jobs 1, 2 e 4. Os jobs 3 (SCA), 4 (docker) e 5 (gitops) sao quase
# identicos - a unica diferenca real no SAST e a ferramenta: bandit em vez de gosec.
#
# ESTAGIOS:
#   1. build-test    - pip install + pytest
#   2. lint          - flake8
#   3. security      - SCA (Trivy fs) + SAST (bandit)  <- BLOQUEIA em CRITICAL
#   4. docker        - build, scan da imagem, push ECR  (so na main)
#   5. update-gitops - troca a tag no manifesto          (so na main)
# ============================================================================

name: Reusable CI (Python)

on:
  workflow_call:
    inputs:
      service:
        description: "Nome do microsservico, ex: flag-service"
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.12"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: toggle-master/${{ inputs.service }}
  SERVICE_PATH: microservices/${{ inputs.service }}

jobs:
  # =========================================================================
  # 1. BUILD (install deps) & UNIT TEST
  # =========================================================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Instalar dependencias
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar testes
        working-directory: ${{ env.SERVICE_PATH }}
        # Se nao houver testes, pytest retorna codigo 5. O "|| true" so nesse
        # caso especifico evita falhar por AUSENCIA de testes. Se um teste
        # existir e falhar, o codigo e 1 e o pipeline quebra normalmente.
        run: pytest -v || [ $? -eq 5 ]

  # =========================================================================
  # 2. LINT
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: flake8
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          pip install flake8
          # E9,F63,F7,F82 = erros reais de sintaxe/nomes (quebram).
          # O resto vira aviso (--exit-zero) para nao travar por estilo.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=120 --statistics

  # =========================================================================
  # 3. SECURITY - SCA (dependencias) + SAST (codigo)
  #
  # DEMO DA FALHA (para o video), em Python. O bandit detecta como B105:
  #
  #   DB_PASSWORD = "hardcoded-secret-123"
  #
  # Ou, ainda mais chamativo, B307:
  #
  #   eval(user_input)
  #
  # Commit -> pipeline falha aqui. Remove -> pipeline passa.
  # =========================================================================
  security:
    name: Security (SCA + SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- SCA: vulnerabilidades nas dependencias (requirements.txt) ----
      - name: Trivy filesystem (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_PATH }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # ---- SAST: vulnerabilidades no codigo Python ----
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: bandit (SAST)
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          pip install bandit
          # -ll = reporta apenas severidade MEDIA e ALTA (ignora ruido baixo)
          # Sem -ll voce pega muito falso-positivo de severidade baixa.
          bandit -r . -ll

  # =========================================================================
  # 4. DOCKER BUILD, SCAN & PUSH  (so na main)
  # =========================================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar tag (data + hash do commit)
        id: meta
        run: echo "tag=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem (local, sem push ainda)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          load: true
          push: false
          tags: ${{ inputs.service }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ inputs.service }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push para o ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag ${{ inputs.service }}:$TAG $REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG
          echo "Publicado: $REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG"

  # =========================================================================
  # 5. UPDATE GITOPS  (so na main)
  # =========================================================================
  update-gitops:
    name: Atualizar manifesto GitOps
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Instalar yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Atualizar a tag da imagem no deployment
        env:
          TAG: ${{ needs.docker.outputs.image_tag }}
          SERVICE: ${{ inputs.service }}
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/toggle-master/${SERVICE}:${TAG}"
          FILE="gitops/${SERVICE}/deployment.yaml"
          yq -i ".spec.template.spec.containers[0].image = \"${IMAGE}\"" "$FILE"
          echo "--- diff ---"; git diff "$FILE"

      - name: Commit e push
        env:
          TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/
          git diff --staged --quiet && echo "Nada a commitar" && exit 0
          git commit -m "chore(${{ inputs.service }}): bump image to ${TAG} [skip ci]"
          git push

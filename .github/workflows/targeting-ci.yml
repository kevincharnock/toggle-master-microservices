# CI do targeting-service (Python)
# Arquivo fino: so os gatilhos. A logica esta em reusable-ci-python.yml.
name: targeting-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'microservices/targeting-service/**'
      - '.github/workflows/targeting-ci.yml'
      - '.github/workflows/reusable-ci-python.yml'
  push:
    branches: [main]
    paths:
      - 'microservices/targeting-service/**'
      - '.github/workflows/targeting-ci.yml'
      - '.github/workflows/reusable-ci-python.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci-python.yml
    with:
      service: targeting-service
    secrets: inherit

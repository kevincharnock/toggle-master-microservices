# ============================================================================
# Deployment do evaluation-service
#
# Diferente dos outros: nao usa Postgres. Consome Redis (cache) e SQS (fila).
# Por isso as variaveis de ambiente vem de um ConfigMap, nao de um Secret -
# endpoint de Redis e URL de fila nao sao segredo.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: default
  labels:
    app: evaluation-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: evaluation-service
          # >>> ESTA LINHA E REESCRITA PELO CI <<<
          image: 604218333422.dkr.ecr.us-east-1.amazonaws.com/toggle-master/evaluation-service:20260915-5e44a10
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: evaluation-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: default
---
# ConfigMap: preencha com os outputs do terraform
#   terraform output redis_endpoint
#   terraform output sqs_queue_url
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-config
  namespace: default
data:
  REDIS_URL: "redis://toggle-master-dev-redis.5xmkjq.ng.0001.use1.cache.amazonaws.com:6379"
  FLAG_SERVICE_URL: "http://flag-service:8002"
  TARGETING_SERVICE_URL: "http://targeting-service:8003"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/604218333422/toggle-master-dev-events"
  AWS_REGION: "us-east-1"

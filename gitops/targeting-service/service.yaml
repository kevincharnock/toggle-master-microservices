# ============================================================================
# Service do targeting-service
#
# ClusterIP = so acessivel de dentro do cluster. Outros microsservicos
# alcancam este pelo nome DNS: http://targeting-service:8080
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: default
  labels:
    app: targeting-service

spec:
  type: ClusterIP

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

  selector:
    app: targeting-service

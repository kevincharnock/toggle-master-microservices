# ============================================================================
# Service do flag-service
#
# ClusterIP = so acessivel de dentro do cluster. Outros microsservicos
# alcancam este pelo nome DNS: http://flag-service:8080
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: default
  labels:
    app: flag-service

spec:
  type: ClusterIP

  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP

  selector:
    app: flag-service

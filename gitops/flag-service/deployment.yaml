# ============================================================================
# Deployment do flag-service
#
# A LINHA DA IMAGEM abaixo e reescrita automaticamente pelo CI a cada deploy.
# O ArgoCD detecta essa mudanca no Git e aplica no cluster sozinho.
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: default
  labels:
    app: flag-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      serviceAccountName: flag-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: flag-service
          # >>> ESTA LINHA E REESCRITA PELO CI <<<
          image: 604218333422.dkr.ecr.us-east-1.amazonaws.com/toggle-master/flag-service:20261115-c643410
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-db-secret
                  key: database_url
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
          # OpenTelemetry (Fase 4): telemetria vai para o OTel Collector gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway.observability.svc:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=togglemaster,deployment.environment=dev"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
              value: "health"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Liveness: se falhar, o Kubernetes REINICIA o pod
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          # Readiness: se falhar, o pod para de receber trafego (mas nao reinicia)
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flag-service
  namespace: default
